# campaign_roles.yml — the 7 DISTINCT roles behind 10 LinkedIn postings (2026-08-02).
#
# Dedupe evidence, not judgement: `dupe_of` rows were confirmed by comparing the
# extracted JD text byte-for-byte, or by reading two near-identical postings from the
# same team. Ten postings → seven applications. Applying to all ten would have sent the
# same team two copies of the same person.
#
# One entry per application target. `search_keyword_mismatch` records where the
# LinkedIn search phrase does NOT describe the actual JD — worth knowing before a
# resume is tailored to the wrong thing.

- slug: gdm-ssi-self-improving-agents
  job_id: "4437900123"
  title: "Research Engineer, DeepMind (Science & Strategic Initiatives)"
  company: "Google DeepMind"
  location: "Mountain View, CA"
  comp: "$262,000–$365,000 + 25% bonus + equity"
  search_keyword_mismatch: >-
    Found via the keyword "Research Engineer, Human Understanding". The JD is not a
    human-understanding role at all — it is SSI: a self-improving agent framework,
    automated failure-mode diagnosis, and eval pipelines beyond lab benchmarks. The
    human_ai_interaction capability does not even trigger on this text.
  resume:
    title: "Research Engineer — Self-Improving Agent Systems · Automated Failure Diagnosis · Eval Beyond Benchmarks"
    thesis: >-
      This role's three duties are my daily build: diagnose agent failure modes
      automatically, build eval pipelines that capture real-world quality beyond lab
      benchmarks, and characterize model limitations with empirical evidence. I have
      shipped each — including the uncomfortable version, where the audit demoted my own
      published claim.
    lead: [vlm_probe_audit, rewardforge, mcp_arena, loop_engineering, enterprise_eval]
    also: [fmos_hub, scwm]
    honest_edge: >-
      My distributed-systems depth is the real edge here: I have curated and used
      large-scale training infrastructure, but I have not owned a MapReduce/Spark/BigQuery
      data platform in production. I would be learning that stack, not teaching it.

