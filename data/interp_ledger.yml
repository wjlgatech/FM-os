# ─────────────────────────────────────────────────────────────────────────────
# interp_ledger.yml — the AI Interpretability & Alignment claim ledger.
#
# WHY THIS FILE EXISTS (the 10x):
# The seed for this section was an AI-generated summary of a podcast on
# interpretability. It was fluent, well-organised, confidently formatted — and
# a meaningful fraction of its proper nouns were WRONG. Nothing in the artifact
# distinguished the parts that were right from the parts that were invented.
#
# That is not a footnote about transcription quality. It is the SAME failure
# this whole field studies, one level up: a fluent surface carries no signal
# about which of the internal steps that produced it were reliable. So the
# section is built around the only fix that exists at either level — do not
# trust the output text; check it against something outside itself.
#
# STATUS VOCABULARY (each one earned its place):
#   verified            the source said it; a primary source confirms it
#   corrected           the source was wrong; both forms are kept, side by side
#   refuted_correction  WE proposed a correction and the primary source proved
#                       US wrong. Kept because a corrector that silently drops
#                       its own misses reports a fake accuracy.
#   omitted             a material caveat the PRIMARY source states and the
#                       summary dropped. An omission is not a small error: it
#                       is the error you cannot see by reading the artifact.
#   unverified          we could not check it. Never citable. "Could not look"
#                       is never "all clear".
#
# RULES (enforced by scripts/interp.py, fail-closed):
#   * every non-`unverified` entry needs a primary-source URL
#   * `corrected` must record verified_as DIFFERENT from as_transcribed
#   * `refuted_correction` must record `proposed` — the wrong correction itself
#   * `unverified` must record `why` — what specifically stopped us
#   * a claim goes STALE after half_life_days and stops being citable
#   * `--cite <id>` REFUSES to emit a non-citable claim; that is the gate
#
# North star: Verified Claim Coverage — citable / total, reported honestly.
# Contract: docs/research/INTERPRETABILITY.md
# ─────────────────────────────────────────────────────────────────────────────

source:
  kind: podcast-transcript-summary
  title: "AI可解释性与对齐：J-Space，思维链，AI人格，幻觉，与金门大桥【101视频播客】"
  url: https://www.youtube.com/watch?v=J5_90lWxM_o
  pipeline: "speech recognition → LLM summarisation (structure, headings, quotes)"
  received: 2026-08-27
  note: >-
    The summary is a good one. That is the point: quality of prose and accuracy
    of reference are independent axes, and only one of them is visible.

# Facts about frontier labs move fast; a name does not. Defaults reflect that.
half_life_days:
  person: 730
  org: 365
  paper: 1825
  method: 1095
  finding: 365
  quote: 3650

claims:

  # ── people ─────────────────────────────────────────────────────────────────
  - id: arora
    kind: person
    as_transcribed: "Arian (Arman) — Stanford PhD student, Georgetown undergrad linguistics, advised by Chris Potts"
    verified_as: "Aryaman Arora — Stanford PhD student, B.S. CS + Linguistics at Georgetown, co-advised by Dan Jurafsky AND Christopher Potts"
    status: corrected
    source: https://aryaman.io/
    checked: 2026-08-27
    note: >-
      Two errors in one entry, of different kinds. The name is a phonetic miss
      by speech recognition. The single-advisor claim is not — nobody misheard
      "and Dan Jurafsky"; a detail was dropped and the sentence still read as
      complete. The second kind is the dangerous one.

  - id: potts
    kind: person
    as_transcribed: "Chris Potts — Professor at Stanford University"
    verified_as: "Christopher Potts — Professor of Linguistics and, by courtesy, of Computer Science, Stanford"
    status: verified
    source: https://web.stanford.edu/~cgpotts/
    checked: 2026-08-27

  - id: schneider
    kind: person
    as_transcribed: "Nathan Schneider — Professor at Georgetown University"
    verified_as: "Nathan Schneider — Associate Professor of Linguistics and Computer Science, Georgetown"
    status: verified
    source: https://people.cs.georgetown.edu/nschneid/
    checked: 2026-08-27
    note: "Rank imprecise (Associate, not full); person, institution and role are right."

  - id: bau
    kind: person
    as_transcribed: "David Ba — Professor at Northwestern University leading an interpretability research group"
    verified_as: "David Bau — Assistant Professor, Khoury College, NORTHEASTERN University; director/PI of the National Deep Inference Fabric"
    status: corrected
    source: https://baulab.info/
    checked: 2026-08-27
    note: >-
      Northwestern and Northeastern are one letter-cluster apart and both are
      real US universities with real CS departments. This is the error class no
      plausibility check catches — the wrong answer is exactly as plausible as
      the right one.

  - id: wu_zen
    kind: person
    as_transcribed: "Zen Ju (Zen / Zen Junction) — interpretability researcher, PhD collaborator of Arian, researcher at Transloose"
    verified_as: "Zhengxuan 'Zen' Wu — CS PhD student at Stanford; co-author with Arora on AxBench"
    status: corrected
    source: https://nlp.stanford.edu/~wuzhengx/
    checked: 2026-08-27
    note: "The Transluce affiliation for this person is tracked separately as `wu_transluce` — unverified."

  - id: wu_transluce
    kind: finding
    as_transcribed: "Zen Ju is a researcher at Transloose who focused on model steering and user modeling"
    status: unverified
    why: >-
      Transluce's public team page and Wu's Stanford page were both read; neither
      states this affiliation. Absence from two pages is not disproof — he may be
      a collaborator, intern or alum without a listing. So: not confirmed, not
      denied, and not citable.
    checked: 2026-08-27

  - id: askell
    kind: person
    as_transcribed: "Amanda Askell — AI safety researcher at Anthropic whose digital persona was used to audit model caution"
    verified_as: "Amanda Askell — Anthropic; has led personality/character alignment for Claude since 2021"
    status: verified
    source: https://en.wikipedia.org/wiki/Amanda_Askell
    checked: 2026-08-27

  - id: pavlick
    kind: person
    as_transcribed: "Ellie Pavlick — influential professor and researcher in AI interpretability"
    verified_as: "Ellie Pavlick — Associate Professor of Computer Science, Brown University"
    status: verified
    source: https://cs.brown.edu/people/epavlick/
