  - id: chris_re
    kind: person
    as_transcribed: "Chris Ré — Stanford Professor whose student group applied mechanistic findings to state space models"
    verified_as: "Christopher Ré — Professor of Computer Science, Stanford (HazyResearch); senior author on H3"
