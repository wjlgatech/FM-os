    source_id: podcast
    kind: finding
    as_transcribed: "(absent)"
    verified_as: >-
      The authors state the J-lens "is undoubtedly an imperfect method, which
      only approximately captures the model's 'true workspace' — for instance,
      it can only identify concepts that correspond to single tokens", that the
