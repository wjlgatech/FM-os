  # ── source: secondary — the search/aggregator layer, scored the same way ────
  - id: alignment_trilemma
    source_id: secondary
    kind: finding
    as_transcribed: >-
      An aggregator summary of the 2026 safety literature: the "Alignment
      Trilemma" shows that no single method can guarantee strong optimization,
      perfect value capture, and robust generalization simultaneously.
    verified_as: >-
      The primary source says the opposite in plain words. EvalSafetyGap
      (arXiv:2606.30219) organises three desiderata — optimization
      effectiveness, value/construct fidelity, robust generalization — and
      states: "The term 'Trilemma' is used as an engineering checklist, not as
      an impossibility result." Separate formal impossibility work exists (the
      RLHF trilemma, arXiv:2511.19504) but is a different claim about different
      quantities.
    status: corrected
    source: https://arxiv.org/pdf/2606.30219
    checked: 2026-08-27
    note: >-
      A checklist promoted to a theorem in one citation hop, and the promotion
      is invisible in the sentence that carries it — "shows that no single
      method can guarantee" reads exactly like a result. This is the podcast's
      failure mode reproduced in a different pipeline, which is the first
      evidence that the rate is a property of summarisation and not of one
      episode.

