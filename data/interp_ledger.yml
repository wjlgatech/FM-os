      explicitly religiously motivated. Boole had a formative experience as a
      teenager which he took as a divine call to state the laws of thought
      mathematically; Canon Mark Hartnell summarises it as "He felt called by
      God to explain mathematically the laws of the world."
    status: omitted
    source: https://www.patheos.com/blogs/anxiousbench/2019/03/boole-science-and-faith/
    checked: 2026-08-27
    note: >-
      The 300-year lens. The algebra every transistor runs on was written by a
      man who believed he was transcribing something given. That is a fact about
      the history of computing, not an argument for anything.

  - id: tolkien_applicability
    source_id: secondary
    kind: quote
    as_transcribed: "(absent from the summary layer)"
    verified_as: >-
      Tolkien, Foreword to the second edition of The Lord of the Rings (1966):
      "I cordially dislike allegory in all its manifestations... I much prefer
      history, true or feigned, with its varied applicability to the thought and
      experience of readers. I think that many confuse 'applicability' with
      'allegory'; but the one resides in the freedom of the reader, and the
      other in the purposed domination of the author."
    status: omitted
    source: https://tolkiengateway.net/wiki/The_Lord_of_the_Rings/Quotations
    checked: 2026-08-27
    note: "The craft rule this season is built on. Also: Tolkien wrote LOTR; Lewis wrote Narnia."

  - id: lewis_supposal
    source_id: secondary
    kind: quote
    as_transcribed: "(absent from the summary layer)"
    verified_as: >-
      C.S. Lewis, 1962 letter: "The Narnian books are not as much allegory as
      supposal. 'Suppose there were a Narnian world and it, like ours, needed
      redemption. What kind of incarnation and Passion might Christ be supposed
      to undergo there?'" Lewis contrasts this with Bunyan's Giant Despair,
      which REPRESENTS despair, whereas Aslan is "an invention giving an
      imaginary answer" to a hypothetical.
    status: omitted
    source: https://www.narniaweb.com/2020/08/why-c-s-lewis-said-narnia-is-not-allegory-at-all/
    checked: 2026-08-27
    note: >-
      Both Inklings rejected allegory as the mode, from opposite directions. The
      SUPPOSAL claim class in contract.yml takes Lewis's own word for it.

  - id: leibniz_theology
    source_id: secondary
    kind: person
    as_transcribed: "(absent from the summary layer)"
    status: unverified
    why: >-
      Leibniz's characteristica universalis and calculus ratiocinator are well
      documented as a project to mechanise reasoning, and it is widely repeated
      that his motive was partly theological. The sources retrieved cover the
      logic and say nothing about the motive. A plausible, attractive claim that
      would have strengthened the 300-year arc is exactly the kind that should
      not be asserted on its attractiveness. Left out of the article.
    checked: 2026-08-27
