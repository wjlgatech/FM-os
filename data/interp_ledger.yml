      without citing a timestamped talk. "Widely reported" is not a citation,
      and secondary sources agreeing with each other is exactly what a citation
      is supposed to rule out. What would close it: a named talk or interview
      with a timestamp or transcript line. Until then, cite the IDEA and drop
      the quotation marks.
