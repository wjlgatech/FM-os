# resume_facts.yml — Paul's VERIFIED facts, one place, reused by every tailored resume.
#
# WHY spec-as-data: seven "custom resumes" written by hand drift into seven different
# claims about the same work, and a claim that appears in one and not another is the kind
# of inconsistency an interviewer notices. So the facts live here ONCE and each role
# selects and orders them (see `resume` blocks in data/campaign_roles.yml).
#
# HARD RULE: nothing enters this file that is not already in a shipped artifact or in
# Paul's own prior resumes (docs/jd-fit/resumes/*.md). Tailoring means CHOOSING and
# ORDERING facts, never inventing or inflating them. Every `evidence` field must point at
# something a reader can open.

