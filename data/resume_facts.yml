  - id: wp_vss_benchmark
    headline: "Failure Benchmarking of NVIDIA's VSS Tool: Insights from Vision-Language Evaluation"
    pub_status: "working paper · first author · in preparation"
    body: >-
      Wu, P.J., Shah, A., Hosseini, P., Shahab, S. — Center for Advanced AI, Accenture. A
      five-mode VLM failure taxonomy made executable over deterministic synthetic stimuli, with
      the Temporal Grounding Score defined as data. Baseline VSS fails 5/5 modes; two frontier
      models pass 5/5 and the smallest reproduces 3/5, so the failures track capability, not
      only late-fusion architecture. No venue selected.
    evidence: "github.com/wjlgatech/FM-os/tree/main/skills/vlm-failure-probe (results table generated by the run)"
    tags: [research, vlm, eval, publishing]

  - id: wp_bare_vlm
    headline: "Adapting the BARE Framework for Synthetic Data Generation in Vision-Language Models"
    pub_status: "working paper · first author · in preparation"
    body: >-
      Wu, P.J., Shah, A., Hosseini, P., Shahab, S. — Center for Advanced AI, Accenture.
      Base-model diversity + instruction-tuned correctness as a twin-gated loop. Mode collapse
      reproduced (0.23 vs 0.62); base-model hallucination did not. Our own first negative was
      retracted as underpowered (0/18 ⇒ CI [0, 16.7%]) and re-resolved at n=66 and n=72 as a
      genuine one. No venue selected.
    evidence: "github.com/wjlgatech/FM-os/tree/main/skills/syndata-bare"
    tags: [research, vlm, eval, rigor, publishing]

  - id: wp_rewardforge
    headline: "Eval gates as training-signal factories (RewardForge)"
    pub_status: "working paper · unpublished, not submitted"
    body: >-
      Every honest eval gate both certifies quality and labels preference data. 162 pairs from
      certified gates, zero human labels → DPO from scratch → LoRA → held-out hallucination
      0.398→0.287; five seeds against a pre-committed criterion, treatment +0.098±0.028 vs
      shuffled-label control −0.046±0.055.
    evidence: "github.com/wjlgatech/FM-os/tree/main/labs/rewardforge"
    tags: [research, posttraining, eval, publishing]

  - id: wp_mcp_arena
    headline: "Evidence-gated benchmarking of agentic tool use (MCP-Arena)"
    pub_status: "working paper · unpublished, not submitted"
    body: >-
      12 tasks × 6 failure-mode categories over real MCP servers, asserting the tool-call trace
      rather than the prose, so a fluent answer with no tool calls scores zero by construction;
      ships a hallucinating mock that must score 0 in CI.
    evidence: "github.com/wjlgatech/mcp-arena"
    tags: [research, agents, eval, publishing]

  - id: wp_thomson_ledger
    headline: "Predicting a frontier lab's post-training stack, scored rather than asserted"
    pub_status: "working paper · 12 predictions registered, Brier UNSCORED"
    body: >-
      A ten-stage reconstruction of a frontier lab's training stack read from its publications,
      with 12 falsifiable claims registered 2026-08-13 and resolving by 2026-12-31 against the
      eventual technical report. 0 of 12 resolved, so the Brier score is reported UNSCORED
      rather than estimated.
    evidence: "github.com/wjlgatech/FM-os/blob/main/docs/research/CASE-STUDY-thomson-stack.md"
    tags: [research, eval, rigor, publishing]

  - id: wp_zero_numerator
    headline: "The zero that wasn't evidence — power discipline for gates that report negatives"
    pub_status: "methods note · unpublished, not submitted"
    body: >-
      An audit of our own false negative and the rule it produced: wherever a gate reports a
      negative it must state the n and the smallest effect that n could have resolved — with a
      runnable tool (Wilson intervals, rule of three, minimum detectable difference), because a
      rule without one is a slogan.
    evidence: "github.com/wjlgatech/FM-os/blob/main/docs/research/POWER-AND-THE-ZERO-NUMERATOR.md"
    tags: [research, rigor, eval, publishing]


