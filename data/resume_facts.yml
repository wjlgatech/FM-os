# ── proof blocks: each is one shipped thing with a measured number ────────────
proof:
  - id: rewardforge
    headline: "Eval gates → preference data → a REAL gated fine-tune"
    body: >-
      162 preference pairs labeled by certified eval gates (zero human labels) → DPO loss
      written from scratch (torch+peft) → LoRA on a small open model → held-out
      hallucination 0.398→0.287, SHIP. Under a median+separation criterion committed to
      git BEFORE the 5-seed run: treatment +0.098±0.028 vs shuffled-label control
      −0.046±0.055, complete arm separation. The same gate rolled back a collapsed run
      first: the honest negative result was reported before the positive one.
    evidence: "github.com/wjlgatech/FM-os/tree/main/labs/rewardforge"
    tags: [posttraining, eval, self_improving, rigor]

  - id: vlm_probe_audit
    headline: "Audited my own benchmark and it demoted my own published result"
    body: >-
      A VLM failure taxonomy as data → gated probe suite. Then a 3-repeat variance run
      found the grader, not the model, was the least reliable component: three harness
      bugs were MANUFACTURING failures (an empty API response scored 0.0; a truncated
      answer graded as complete; the suite's own tests never gated by CI). Fixing them
      cut instability from 5 unstable probe/model pairs to 1, and forced a correction to
      a capability claim I had already put in a paper table. Every spec change was
      pre-registered with falsifiable per-probe predictions BEFORE the run that tested it.
    evidence: "github.com/wjlgatech/FM-os/tree/main/skills/vlm-failure-probe"
    tags: [eval, failure_diagnosis, rigor, vlm]

  - id: mcp_arena
    headline: "Evidence-gated tool-use benchmark over real MCP servers"
    body: >-
      12 tasks × 6 failure-mode categories as data, over REAL MCP servers; the tool-call
      trace is asserted, so "right words, no tool calls" scores zero by construction. The
      harness ships its own falsifier — an EvidenceHallucinator mock that must score 0 in
      CI. Failures export as DPO preference pairs.
    evidence: "github.com/wjlgatech/mcp-arena"
    tags: [agents, eval, self_improving, tooluse]

  - id: loop_engineering
    headline: "Self-improving harness with an independent referee"
    body: >-
      generate → judge → refactor loops where quality comes ONLY from an independent
      referee (maker ≠ checker, enforced fail-closed); convergence policy with plateau
      detection, regression rollback and budgets; live-verified F→A runs. 543 tests.
    evidence: "github.com/wjlgatech/loop-engineering-anything"
    tags: [self_improving, agents, cross_deployment, rigor]

  - id: enterprise_eval
    headline: "The eval framework that decided production model selection"
    body: >-
      Primary technical interface on an executive-level enterprise AI deployment
      (Accenture OpenAI-DSI). Built the multi-model evaluation framework comparing 6+ VLMs
      (Gemini-class, NVIDIA VSS, Cosmos-Predict2) on accuracy, latency under load,
      edge-case failure modes and integration cost — the basis for production model
      selection. Shipped a confidence-calibrated selective-verification pipeline routing
      only high-uncertainty outputs to human review: ~90% annotation cost reduction.
    evidence: "Accenture, Physical AI Team (2024–present)"
    tags: [eval_realworld, enterprise, deployment, vlm, cross_deployment]

  - id: scwm
    headline: "Self-Calibrating World Models (NeurIPS 2026, under review)"
    body: >-
      Online Bayesian calibration for sim-to-real transfer; 40% transfer-error reduction
      vs domain randomization.
    evidence: "NeurIPS 2026 under review"
    tags: [research, robotics, world_models, publishing]

  - id: physical_ai_paper
    headline: "Physical AI: The Next Frontier in AI and Robotics"
    body: "Preprints.org, Apr 2026. DOI: 10.20944/preprints202604.0549.v1."
    evidence: "DOI 10.20944/preprints202604.0549.v1"
    tags: [research, robotics, publishing]

  - id: hci_study_gate
    headline: "A gate that refuses a human-study claim the design cannot support"
    body: >-
      Required N from the target effect size, counterbalancing against order effects, one
      pre-registered primary metric — and NOT-MEASURED instead of a p-value an
      underpowered study cannot earn. Power math pinned to the conventional values and
      rounded toward MORE participants, because for a gate one too few is a false pass.
      Certified 93/100, 18 tests.
    evidence: "github.com/wjlgatech/FM-os/tree/main/skills/hci-study-gate"
    tags: [hci, eval, rigor]

